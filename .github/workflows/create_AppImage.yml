name: Build AyuGram .AppImage (Docker)

on:
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    permissions:
      contents: write

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 2. Sync code từ AyuGram
      - name: Sync upstream AyuGram
        run: |
          git remote add upstream https://github.com/AyuGram/AyuGramDesktop.git || true
          git fetch upstream --tags
          git checkout dev || git checkout master
          git reset --hard upstream/dev || git reset --hard upstream/master

      # 3. Xử lý Submodules
      - name: Fix submodules
        run: |
          git submodule init
          git config submodule.Telegram/lib_ui.url https://github.com/desktop-app/lib_ui.git || true
          git config submodule.Telegram/ThirdParty/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git || true
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # 4. Lấy version
      - name: Get version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      # 5. Cache ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-docker-appimage-${{ runner.os }}-${{ env.VERSION }}
          restore-keys: |
            ccache-docker-appimage-${{ runner.os }}-

      # 6. Build trong Docker (Môi trường CentOS 7 chuẩn)
      - name: Build in Docker
        run: |
          mkdir -p out .ccache
          docker run --rm \
            -u root \
            -e CCACHE_DIR=/usr/src/tdesktop/.ccache \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            bash -c "
              export PATH=/usr/lib64/ccache:\$PATH &&
              ccache -M 10G &&
              /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                -D TDESKTOP_API_ID=2040 \
                -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
                -D DESKTOP_APP_USE_PACKAGED=OFF
            "

      # 7. Fix quyền file
      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER .

      # 8. Đóng gói AppImage
      - name: Package AppImage
        run: |
          # A. Chuẩn bị công cụ linuxdeploy
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

          # B. Tạo cấu trúc thư mục AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # C. Copy file thực thi (Xử lý tên file Telegram -> ayugram)
          if [ -f "out/Release/AyuGram" ]; then
            cp out/Release/AyuGram AppDir/usr/bin/ayugram
          elif [ -f "out/Release/Telegram" ]; then
            echo "Renaming Telegram binary to ayugram..."
            cp out/Release/Telegram AppDir/usr/bin/ayugram
          else
            echo "ERROR: Binary not found!"
            exit 1
          fi
          
          chmod +x AppDir/usr/bin/ayugram

          # D. Copy Icon
          # Tìm icon trong source, nếu không thấy thì dùng lệnh find
          ICON_PATH="Telegram/Resources/art/icon256.png"
          if [ ! -f "$ICON_PATH" ]; then
             ICON_PATH=$(find . -name "icon256.png" | head -n 1)
          fi
          cp "$ICON_PATH" AppDir/usr/share/icons/hicolor/256x256/apps/ayugram.png

          # E. Tạo Desktop File
          cat > AppDir/usr/share/applications/ayugram.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=AyuGram
          Exec=ayugram %u
          Icon=ayugram
          Categories=Network;InstantMessaging;Chat;
          Terminal=false
          MimeType=x-scheme-handler/tg;
          StartupWMClass=AyuGram
          EOF

          # F. Chạy linuxdeploy để tạo AppImage
          # --appdir: Thư mục nguồn
          # --output appimage: Định dạng đầu ra
          # --desktop-file: Chỉ định file desktop để lấy metadata
          # --icon-file: Chỉ định icon
          
          export VERSION=${{ env.VERSION }}
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/ayugram.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/ayugram.png

          # G. Đổi tên file kết quả cho đẹp
          mv AyuGram*.AppImage AyuGram-${{ env.VERSION }}-x86_64.AppImage

      # 9. Release
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AyuGram v${{ env.VERSION }} (AppImage)
          body: |
            AyuGram Portable AppImage.
            Built with Docker (CentOS 7 Env) for maximum compatibility.
          files: AyuGram-${{ env.VERSION }}-x86_64.AppImage
          
