name: Build and Release AyuGram AppImage

on:
  push:
    tags:
      - 'v*' # Chạy khi bạn push tag có định dạng v1.0, v2.1.3...
  workflow_dispatch: # Cho phép chạy thủ công để test

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Quan trọng: Cho phép action tạo release

    - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # Bước này cực kỳ quan trọng đối với các dự án lớn như AyuGram
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            python3 python3-pip libvulkan-dev vulkan-tools \
            libavformat-dev libavcodec-dev libswresample-dev \
            libswscale-dev libopus-dev libva-dev libvdpau-dev \
            libasound2-dev libpulse-dev libgtk-3-dev \
            libxcb-keysyms1-dev libxcb-record0-dev \
            libxcb-screensaver0-dev libxcb-composite0-dev \
            libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-util-dev libx11-xcb-dev libxtst-dev \
            liblzma-dev libssl-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libenchant-2-dev libsecret-1-dev libhunspell-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          # Đã sửa tên module cho Qt6
          modules: 'qtimageformats' 
          # Lưu ý: qtwayland thường đã có sẵn trong bản build mặc định của aqt cho Linux, 
          # nếu vẫn báo thiếu bạn có thể thử thêm 'qtwayland' mà không có tiền tố.

      - name: Build AyuGram
        run: |
          mkdir build
          cd build
          # Thêm cờ -DDESKTOP_APP_USE_PACKAGED=OFF để nó tự build các thư viện thiếu (như ada)
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DDESKTOP_APP_USE_PACKAGED=OFF
          
          # Chỉ dùng 2 CPU để build nhằm tránh lỗi tràn bộ nhớ (OOM) trên GitHub
          ninja -j 2

          
      - name: Prepare AppDir and Package AppImage
        run: |
          # Tải công cụ đóng gói
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Cấu hình thư mục AppDir
          mkdir -p AppDir/usr/bin
          cp build/bin/ayugram AppDir/usr/bin/ayugram
          
          # Tạo AppImage (linuxdeploy sẽ tự tìm desktop file và icon nếu có trong repo)
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          # Đổi tên file cho chuyên nghiệp (ví dụ: AyuGram-v1.0.0-x86_64.AppImage)
          mv *.AppImage AyuGram-${{ github.ref_name }}-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: AyuGram-*.AppImage
          name: Release ${{ github.ref_name }}
          body: "Bản build tự động AyuGram AppImage cho Linux."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
