name: Build AyuGram Ultimate with Cache

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-
          max-size: 2G

      - name: Install All Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 python3-pip \
            libvulkan-dev vulkan-tools libwayland-dev wayland-protocols \
            libboost-all-dev libssl-dev libxxhash-dev liblzma-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libpostproc-dev \
            libopus-dev libva-dev libvdpau-dev libasound2-dev libpulse-dev \
            libgtk-3-dev libsecret-1-dev libhunspell-dev libenchant-2-dev \
            libxcb-keysyms1-dev libxcb-record0-dev libxcb-screensaver0-dev \
            libxcb-composite0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-util-dev libx11-xcb-dev libxtst-dev \
            libxcb-xkb-dev libxkbcommon-x11-dev libxcb-cursor-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libprotobuf-dev protobuf-compiler qt6-wayland ccache \
            libfmt-dev libopenal-dev librnnoise-dev libgoogle-perftools-dev \
            libnuma-dev libjpeg-dev libpng-dev libwebp-dev libz-dev

      - name: Force Protobuf Detection
        run: |
          sudo mkdir -p /usr/local/lib/cmake/protobuf
          echo 'set(protobuf_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/protobuf/protobuf-config.cmake
          echo 'set(protobuf_VERSION "3.12.4")' | sudo tee -a /usr/local/lib/cmake/protobuf/protobuf-config.cmake
          echo 'add_library(protobuf::libprotobuf UNKNOWN IMPORTED)' | sudo tee -a /usr/local/lib/cmake/protobuf/protobuf-config.cmake
          echo 'set_target_properties(protobuf::libprotobuf PROPERTIES IMPORTED_LOCATION "/usr/lib/x86_64-linux-gnu/libprotobuf.so" INTERFACE_INCLUDE_DIRECTORIES "/usr/include")' | sudo tee -a /usr/local/lib/cmake/protobuf/protobuf-config.cmake
          echo 'add_executable(protobuf::protoc IMPORTED)' | sudo tee -a /usr/local/lib/cmake/protobuf/protobuf-config.cmake
          echo 'set_target_properties(protobuf::protoc PROPERTIES IMPORTED_LOCATION "/usr/bin/protoc")' | sudo tee -a /usr/local/lib/cmake/protobuf/protobuf-config.cmake

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: ${{ runner.os }}-qt-6.5.3-shadertools-imageformats
          
      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          dir: ${{ github.workspace }}
          cached: ${{ steps.cache-qt.outputs.cache-hit }}
          modules: 'qtimageformats qtshadertools qtwayland'

      - name: Fix Ada Library (v2.7.4 Stable)
        run: |
          if [ ! -f /usr/local/lib/libada.a ]; then
            git clone https://github.com/ada-url/ada.git
            cd ada && git checkout v2.7.4
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DADA_TESTS=OFF -DADA_BENCHMARKS=OFF
            cmake --build build
            sudo cmake --install build
          fi

      - name: Build AyuGram
        run: |
          git submodule update --init --recursive
          mkdir -p build && cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="/usr/local" \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0144=NEW \
            -DDESKTOP_APP_USE_PACKAGED=OFF \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBOOST_ROOT=/usr \
            -Dprotobuf_DIR=/usr/local/lib/cmake/protobuf \
            -DOPENAL_LIBRARY=/usr/lib/x86_64-linux-gnu/libopenal.so \
            -DOPENAL_INCLUDE_DIR=/usr/include \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          ninja -j 2

      - name: Create AppImage
        run: |
          # 1. Tải công cụ đóng gói
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          # 2. Tạo cấu trúc AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/usr/share/applications
          
          # 3. Copy file thực thi
          find build/bin -type f -executable -exec cp
