name: Build and Release AyuGram AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libvulkan-dev vulkan-tools libwayland-dev wayland-protocols \
            libavformat-dev libavcodec-dev libswresample-dev \
            libswscale-dev libopus-dev libva-dev libvdpau-dev \
            libasound2-dev libpulse-dev libgtk-3-dev \
            libxcb-keysyms1-dev libxcb-record0-dev \
            libxcb-screensaver0-dev libxcb-composite0-dev \
            libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-util-dev libx11-xcb-dev libxtst-dev \
            liblzma-dev libssl-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libenchant-2-dev libsecret-1-dev libhunspell-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtimageformats qtshadertools'

      # CHIẾN THUẬT MỚI: Build và cài đặt ADA trực tiếp vào hệ thống Runner
      - name: Build and Install Ada URL Library
        run: |
          git clone https://github.com/ada-url/ada.git
          cd ada
          git checkout v2.7.4
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DADA_TESTS=OFF -DADA_BENCHMARKS=OFF
          cmake --build build
          sudo cmake --install build
          # Kiểm tra xem adaConfig.cmake đã nằm trong hệ thống chưa
          find /usr/local/lib/cmake/ada -name "*.cmake"

      - name: Build AyuGram
        run: |
          # Cập nhật các submodule khác của AyuGram
          git submodule update --init --recursive
          
          mkdir build_ayugram
          cd build_ayugram
          
          # Cấu hình CMake cho AyuGram
          # Chúng ta trỏ CMAKE_PREFIX_PATH vào /usr/local để chắc chắn nó thấy ada
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/local" \
            -DDESKTOP_APP_USE_PACKAGED=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          
          ninja -j 2

      - name: Prepare and Create AppImage
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin
          # Tìm file binary trong build_ayugram/bin
          find build_ayugram/bin -type f -executable -exec cp {} AppDir/usr/bin/ayugram \;
          
          export VERSION=${{ github.ref_name }}
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          mv *.AppImage AyuGram-${{ github.ref_name }}-x86_64.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: AyuGram-*.AppImage
          name: AyuGram Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
