name: Build and Release AyuGram AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libvulkan-dev vulkan-tools libwayland-dev wayland-protocols \
            libavformat-dev libavcodec-dev libswresample-dev \
            libswscale-dev libopus-dev libva-dev libvdpau-dev \
            libasound2-dev libpulse-dev libgtk-3-dev \
            libxcb-keysyms1-dev libxcb-record0-dev \
            libxcb-screensaver0-dev libxcb-composite0-dev \
            libxcb-ewmh-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-util-dev libx11-xcb-dev libxtst-dev \
            liblzma-dev libssl-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libenchant-2-dev libsecret-1-dev libhunspell-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtimageformats qtshadertools' # Thêm shadertools cho Vulkan/Qt6

      - name: Force Update Submodules (Fix Ada error)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build AyuGram
        run: |
          mkdir build
          cd build
          # -DDESKTOP_APP_USE_PACKAGED=OFF: Dùng thư viện kèm theo (ada, v.v.)
          # -DCMAKE_POLICY_DEFAULT_CMP0135=NEW: Fix lỗi thời gian khi tải dependencies
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DDESKTOP_APP_USE_PACKAGED=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW
          
          # Build với 2 luồng để tránh tràn RAM (GitHub Actions chỉ có 7GB RAM)
          ninja -j 2

      - name: Prepare and Create AppImage
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin
          # Lưu ý: Nếu file binary tên là 'ayugram-desktop' hoặc khác, hãy đổi tên ở đây
          cp build/bin/ayugram AppDir/usr/bin/ayugram || cp build/bin/ayugram-desktop AppDir/usr/bin/ayugram
          
          # Tạo AppImage
          export VERSION=${{ github.ref_name }}
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          # Đổi tên file cuối cùng
          mv *.AppImage AyuGram-${{ github.ref_name }}-x86_64.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: AyuGram-*.AppImage
          name: AyuGram Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
