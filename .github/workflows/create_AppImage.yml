name: Build AyuGram Ultimate with Cache

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install All Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 python3-pip \
            libvulkan-dev vulkan-tools libwayland-dev wayland-protocols \
            libboost-all-dev libssl-dev libxxhash-dev liblzma-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libpostproc-dev \
            libopus-dev libva-dev libvdpau-dev libasound2-dev libpulse-dev \
            libgtk-3-dev libsecret-1-dev libhunspell-dev libenchant-2-dev \
            libxcb-keysyms1-dev libxcb-record0-dev libxcb-screensaver0-dev \
            libxcb-composite0-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-util-dev libx11-xcb-dev libxtst-dev \
            libxcb-xkb-dev libxkbcommon-x11-dev libxcb-cursor-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libprotobuf-dev protobuf-compiler qt6-wayland ccache \
            libfmt-dev libopenal-dev libunwind-dev libgoogle-perftools-dev \
            libnuma-dev libjpeg-dev libpng-dev libwebp-dev libz-dev \
            libvpx-dev \
            gobject-introspection libgirepository1.0-dev # <--- ĐÃ THÊM GÓI NÀY (Sửa lỗi g-ir-scanner)

      - name: Fix Ada Library (v2.7.4 Stable)
        run: |
          git clone https://github.com/ada-url/ada.git
          cd ada && git checkout v2.7.4
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DADA_TESTS=OFF -DADA_BENCHMARKS=OFF
          cmake --build build
          sudo cmake --install build

      - name: Force Library Detection (Fake Configs)
        run: |
          sudo mkdir -p /usr/local/lib/cmake/protobuf /usr/local/lib/cmake/OpenAL \
                        /usr/local/lib/cmake/tde2e /usr/local/lib/cmake/ada \
                        /usr/local/lib/cmake/tg_owt /usr/local/lib/pkgconfig

          # 1. Fake Protobuf
          echo 'set(protobuf_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/protobuf/protobuf-config.cmake

          # 2. Fake OpenAL
          echo 'set(OpenAL_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/OpenAL/OpenALConfig.cmake

          # 3. Fake Ada
          echo 'set(ada_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/ada/adaConfig.cmake
          echo 'if(NOT TARGET ada::ada)' | sudo tee -a /usr/local/lib/cmake/ada/adaConfig.cmake
          echo '  add_library(ada::ada UNKNOWN IMPORTED)' | sudo tee -a /usr/local/lib/cmake/ada/adaConfig.cmake
          echo '  set_target_properties(ada::ada PROPERTIES IMPORTED_LOCATION "/usr/local/lib/libada.a" INTERFACE_INCLUDE_DIRECTORIES "/usr/local/include")' | sudo tee -a /usr/local/lib/cmake/ada/adaConfig.cmake
          echo 'endif()' | sudo tee -a /usr/local/lib/cmake/ada/adaConfig.cmake

          # 4. Fake tde2e
          echo 'set(tde2e_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/tde2e/tde2eConfig.cmake
          echo 'if(NOT TARGET desktop-app::external_tde2e)' | sudo tee -a /usr/local/lib/cmake/tde2e/tde2eConfig.cmake
          echo '  add_library(desktop-app::external_tde2e INTERFACE IMPORTED)' | sudo tee -a /usr/local/lib/cmake/tde2e/tde2eConfig.cmake
          echo 'endif()' | sudo tee -a /usr/local/lib/cmake/tde2e/tde2eConfig.cmake

          # 5. Fake tg_owt
          echo 'set(tg_owt_FOUND TRUE)' | sudo tee /usr/local/lib/cmake/tg_owt/tg_owtConfig.cmake
          echo 'if(NOT TARGET tg_owt::tg_owt)' | sudo tee -a /usr/local/lib/cmake/tg_owt/tg_owtConfig.cmake
          echo '  add_library(tg_owt::tg_owt INTERFACE IMPORTED)' | sudo tee -a /usr/local/lib/cmake/tg_owt/tg_owtConfig.cmake
          echo 'endif()' | sudo tee -a /usr/local/lib/cmake/tg_owt/tg_owtConfig.cmake

          # 6. Fake RNNoise
          cat <<EOF | sudo tee /usr/local/lib/pkgconfig/rnnoise.pc
          prefix=/usr
          Name: rnnoise
          Description: Fake rnnoise
          Version: 0.4.1
          Libs: -lrnnoise
          EOF

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          dir: ${{ github.workspace }}
          modules: 'qtimageformats qtshadertools'

      - name: Build AyuGram
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/lib/pkgconfig
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          mkdir -p build && cd build
          
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/local" \
            -DCMAKE_POLICY_DEFAULT_CMP0135=NEW \
            -DDESKTOP_APP_USE_PACKAGED=OFF \
            -DBoost_NO_BOOST_CMAKE=ON \
            -Dprotobuf_DIR=/usr/local/lib/cmake/protobuf \
            -DOpenAL_DIR=/usr/local/lib/cmake/OpenAL \
            -Dtde2e_DIR=/usr/local/lib/cmake/tde2e \
            -Dada_DIR=/usr/local/lib/cmake/ada \
            -Dtg_owt_DIR=/usr/local/lib/cmake/tg_owt \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          
          ninja -j 2

      - name: Create AppImage
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          find build/bin -type f -executable -exec cp {} AppDir/usr/bin/ayugram \;
          export VERSION=${{ github.ref_name }}
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv *.AppImage AyuGram-Linux-x86_64.AppImage

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: AyuGram-Linux-x86_64.AppImage
          name: AyuGram Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
